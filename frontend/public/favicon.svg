<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="xoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Futuristic Dark Card Frame -->
  <rect width="90" height="90" x="5" y="5" rx="22" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5"/>
  
  <!-- Futuristic Glowing X Emblem -->
  <path d="M 30 30 L 70 70 M 70 30 L 30 70" 
        fill="none" 
        stroke="url(#xoraGrad)" 
        stroke-width="11" 
        stroke-linecap="round" 
        filter="url(#glow)"/>
        
  <!-- AI Intelligence Core Sparkle -->
  <circle cx="50" cy="50" r="8" fill="#A855F7"/>
  <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
</svg>