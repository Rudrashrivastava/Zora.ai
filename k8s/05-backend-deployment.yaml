apiVersion: apps/v1
kind: Deployment
metadata:
  name: zora-backend
  namespace: zora-production
  labels:
    app: zora-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zora-backend
  template:
    metadata:
      labels:
        app: zora-backend
    spec:
      containers:
        - name: backend
          image: zora-backend:latest # Replace with your image repository (e.g., ghcr.io/username/zora-backend:v1.0.0)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: zora-config
            - secretRef:
                name: zora-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: zora-production
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: zora-backend
