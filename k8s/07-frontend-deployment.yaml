apiVersion: apps/v1
kind: Deployment
metadata:
  name: zora-frontend
  namespace: zora-production
  labels:
    app: zora-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zora-frontend
  template:
    metadata:
      labels:
        app: zora-frontend
    spec:
      containers:
        - name: frontend
          image: zora-frontend:latest # Replace with your image repository
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: zora-production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: zora-frontend
